-p\">Podpora chudnutia</p>\n</div>\n<div class=\"p-icon-card\"><img class=\"p-card-img\" src=\"__ASSET_6__\"/>\n<p class=\"p-card-p\">Extrémne spaľovanie tukov</p>\n</div>\n<div class=\"p-icon-card\"><img class=\"p-card-img\" src=\"__ASSET_7__\"/>\n<p class=\"p-card-p\">Redukcia celulitídy</p>\n</div>\n<div class=\"p-icon-card\"><img class=\"p-card-img\" src=\"__ASSET_8__\"/>\n<p class=\"p-card-p\">Redukcia vrások</p>\n</div>\n<div class=\"p-icon-card\"><img class=\"p-card-img\" src=\"__ASSET_9__\"/>\n<p class=\"p-card-p\">Pevné nechty</p>\n</div>\n<div class=\"p-icon-card\"><img class=\"p-card-img\" src=\"__ASSET_10__\"/>\n<p class=\"p-card-p\">Vyrobené v ČR</p>\n</div>\n</div>\n</div>\n<section aria-labelledby=\"gl-collagen-overview-title\" class=\"story-block gl-collagen-overview\">\n<div class=\"story-block-image\"><img alt=\"Žena drží dózu Slim Extreme Collagen\" height=\"2000\" src=\"__ASSET_11__\" width=\"2000\"/></div>\n<div class=\"story-block-text\">\n<h3 class=\"barvaruzova\" id=\"gl-collagen-overview-title\">Ako funguje Slim Extreme Collagen</h3>\n<p>Slim Extreme Collagen spája kolagénové peptidy Verisol® a Peptiplus® a kyselinu hyalurónovú s komplexom garcínie, zeleného čaju, synefrínu a enzýmov. Je navrhnutý ako súčasť redukčného režimu a každodennej starostlivosti o krásu.</p>\n<p>Zloženie dopĺňajú vitamíny a minerály. Vitamíny B2, B3 a B5 prispievajú k zníženiu únavy a vyčerpania.</p>\n</div>\n</section>\n</div>\n<div class=\"product-container\">\n<h3 class=\"barvaruzova text-center\">Čo vám prinesie</h3>\n<div class=\"ucinky-grid\">\n<div class=\"ucinky-item\"><span class=\"ucinky-icon\">✓</span>Kontrola hmotnosti</div>\n<div class=\"ucinky-item\"><span class=\"ucinky-icon\">✓</span>Novotvorba kolagénu a udržanie normálneho stavu pokožky, vlasov, nechtov a spojivových tkanív</div>\n<div class=\"ucinky-item\"><span class=\"ucinky-icon\">✓</span>Regenerácia organizmu, zlepšenie jeho funkcií</div>\n<div class=\"ucinky-item\"><span class=\"ucinky-icon\" "/>\n<h4 class=\"barvaruzova\">Vitamín C a E</h4>\n<p class=\"latky-teaser\">Tvorba kolagénu a antioxidačná ochrana.</p>\n<a aria-label=\"Viac o vitamíne C a E\" class=\"latky-plus\" href=\"#lm-vitace\">+</a></div>\n<div class=\"odstavec2 has-img\"><img class=\"obrazek-odstavec\" src=\"__ASSET_17__\"/>\n<h4 class=\"barvaruzova\">Zelený čaj</h4>\n<p class=\"latky-teaser\">Antioxidanty a podpora spaľovania.</p>\n<a aria-label=\"Viac o zelenom čaji\" class=\"latky-plus\" href=\"#lm-zelenycaj\">+</a></div>\n</div>\n<div class=\"latky-modal\" id=\"lm-garcinia\"><a aria-label=\"Zavrieť\" class=\"latky-modal-backdrop\" href=\"#latky\"></a>\n<div class=\"latky-modal-box\"><a aria-label=\"Zavrieť\" class=\"latky-modal-close\" href=\"#latky\">×</a> <img alt=\"Garcinia cambogia\" class=\"latky-modal-img\" src=\"__ASSET_12__\"/>\n<h4 class=\"barvaruzova\">Garcinia cambogia</h4>\n<p>Je to tropická rastlina pochádzajúca z Ázie a po stáročia sa používa na navodenie pocitu sýtosti. Kľúčovou účinnou látkou v nej obsiahnutou je kyselina hydroxy-citrónová (HCA), ktorá zlepšuje trávenie, znižuje chuť do jedla a podporuje aj spaľovanie tukov.</p>\n</div>\n</div>\n<div class=\"latky-modal\" id=\"lm-hyaluron\"><a aria-label=\"Zavrieť\" class=\"latky-modal-backdrop\" href=\"#latky\"></a>\n<div class=\"latky-modal-box\"><a aria-label=\"Zavrieť\" class=\"latky-modal-close\" href=\"#latky\">×</a> <img alt=\"Kyselina hyalurónová\" class=\"latky-modal-img\" src=\"__ASSET_13__\"/>\n<h4 class=\"barvaruzova\">Kyselina hyalurónová</h4>\n<p>Látka, ktorá sa prirodzene nachádza a vytvára v našom tele. Jej hlavnou funkciou je zadržiavať vodu, teda hydratovať tkanivá, a udržiavať v nich dostatočnú vlhkosť. Pomáha vyživovať pokožku, ktorá je potom zdravšia a pružnejšia. Obmedzuje tak tvorbu vrások a napomáha regenerácii a celkovému omladeniu pleti. Účinne pomáha pri hojení rán a bolesti kĺbov, zlepšuje ich pohyblivosť.</p>\n</div>\n</div>\n<div class=\"latky-modal\" id=\"lm-mineraly\"><a aria-label=\"Zavrieť\" class=\"latky-modal-backdrop\" href=\"#latky\"></a>\n<div class=\"latky-modal-box\"><a aria-label=\"Zavrieť\" class=\"latky-modal-close\" href=\"#latky\">×</a> <img alt=\"Minerály a enzýmy\" class=\"latky-modal-img\" src=\"__ASSET_14__\"/>\n<h4 class=\"barvaruzova\">Minerály a enzýmy</h4>\n<p>Bromelaín s papaínom je unikátnou kombináciou dvoch enzýmov, ktoré sa nachádzajú v ananáse a papáji. Oba pôsobia pozitívne na trávenie a ovplyvňujú rozklad bielkovín, čo ocenia najmä športovci. Obsiahnutý zinok sa podieľa na delení buniek, prispieva k normálnemu metabolizmu a chráni bunky pred voľnými radikálmi.</p>\n</div>\n</div>\n<div class=\"latky-modal\" id=\"lm-bkomplex\"><a aria-label=\"Zavrieť\" class=\"latky-modal-backdrop\" href=\"#latky\"></a>\n<div class=\"latky-modal-box\"><a aria-label=\"Zavrieť\" class=\"latky-modal-close\" href=\"#latky\">×</a> <img alt=\"B komplex\" class=\"latky-modal-img\" src=\"__ASSET_15__\"/>\n<h4 class=\"barvaruzova\">B komplex</h4>\n<p>Vitamíny B sú nevyhnutné pre správne fungovanie metabolizmu a nervového systému. Zároveň umožňujú vstrebávanie látok a napomáhajú ich lepšiemu využitiu. Vitamíny B2, B3 a B5 prispievajú k zníženiu únavy a vyčerpania, vitamíny B2 a B3 udržiavajú normálny stav pokožky a slizníc.</p>\n</div>\n</div>\n<div class=\"latky-modal\" id=\"lm-vitace\"><a aria-label=\"Zavrieť\" class=\"latky-modal-backdrop\" href=\"#latky\"></a>\n<div class=\"latky-modal-box\"><a aria-label=\"Zavrieť\" class=\"latky-modal-close\" href=\"#latky\">×</a> <img alt=\"Vitamín C a E\" class=\"latky-modal-img\" src=\"__ASSET_16__\"/>\n<h4 class=\"barvaruzova\">Vitamín C a E</h4>\n<p>Vitamín C je dôležitý pre tvorbu nového kolagénu, má pozitívny vplyv na imunitný systém, prispieva k ochrane a tvorbe nových buniek, lepšej regenerácii a zníženiu únavy. Vitamín E je veľmi silný antioxidant, má význam pre rad oxidačno-redukčných pochodov a stabilizuje niektoré hormóny.</p>\n</div>\n</div>\n<div class=\"latky-modal\" id=\"lm-zelenycaj\"><a a
