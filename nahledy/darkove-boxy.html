AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAf9LxfgPbGwTAAAAAElFTkSuQmCC\"/>\n<div class=\"cta-text\">\n<h3 class=\"barvaruzova\">Golden Life Dárkový box – UFIRST<\/h3>\n<p class=\"cta-meta\">Balení: 5 produktů v elegantní dárkové krabici<\/p>\n<div class=\"cta-price\" hidden=\"\"><span class=\"cta-price-value\"><\/span><\/div>\n<p class=\"cta-availability\">Aktuální dostupnost najdeš v e-shopu.<\/p>\n<button class=\"cta-button nad-add-cart\" data-gl-cart=\"\" disabled=\"\" type=\"button\">Nákup v e-shopu<\/button><p aria-live=\"polite\" class=\"gl-cart-message\" data-gl-message=\"\" role=\"status\">Samostatný náhled. Košík a cena se připojí na stránce tohoto boxu.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p class=\"gl-notice\">Doplněk stravy. Není náhradou pestré a vyvážené stravy. Nepřekračujte doporučenou denní dávku. Uchovávejte mimo dosah dětí.<\/p><\/div><\/div>\n<script>/* Gift-box descriptions: local details and safely scoped Shoptet integration. */\n(function () {\n  'use strict';\n  const root = document.querySelector('#special-popis.gl-box-refined');\n  if (!root || root.dataset.glBound) return;\n  root.dataset.glBound = 'true';\n  const action = root.querySelector('[data-gl-cart]');\n  const price = root.querySelector('.cta-price-value');\n  const priceBox = price && price.closest('.cta-price');\n  const availability = root.querySelector('.cta-availability');\n  const message = root.querySelector('[data-gl-message]');\n  let timer;\n  function write(node, value) { if (node && node.textContent !== value) node.textContent = value; }\n  function host() {\n    const form = document.getElementById('product-detail-form');\n    if (!form || root.contains(form)) return null;\n    const productId = form.querySelector('input[name=\"productId\"]');\n    // A configured ID permits direct delegation. Without a verified ID,\n    // read the main state but only scroll to native purchasing controls.\n    if (!productId || !productId.value) return null;\n    if (root.dataset.glProductId && productId.value !== root.dataset.glProductId) return null;\n    return form;\n  }\n  function visible(node) {\n    return !!node && !node.disabled && node.getAttribute('aria-disabled') !== 'true'\n      && node.getClientRects().length > 0 && getComputedStyle(node).visibility !== 'hidden';\n  }\n  function nativeCart(form) {\n    if (!form) return null;\n    return [...form.querySelectorAll('.add-to-cart-button')].find(node => !root.contains(node) && visible(node)) || null;\n  }\n  function preferGallery(form) {\n    if (!form) return;\n    const source = form.querySelector('#main-slider-slide01 img, .p-main-image img, .p-image img');\n    if (!source) return;\n    const src = source.currentSrc || source.getAttribute('src');\n    // Do not replace the prepared image paths with Shoptet's placeholder.\n    if (!src || src.startsWith('data:image/svg') || /missing_images|\\[|\\]/.test(src)) return;\n    root.querySelectorAll('.heroimg,.cta-product-img').forEach(img => {\n      if (img.src !== src) img.src = src;\n    });\n  }\n  function sync() {\n    const form = host();\n    const sourcePrice = form && form.querySelector('.price-final-holder');\n    const sourceStock = form && form.querySelector('.availability-value');\n    const priceText = sourcePrice ? sourcePrice.textContent.trim() : '';\n    const amount = Number(priceText.replace(/[^0-9,.]/g, '').replace(',', '.'));\n    if (priceBox) priceBox.hidden = !priceText || !Number.isFinite(amount) || amount <= 0;\n    write(price, priceText);\n    write(availability, sourceStock ? sourceStock.textContent.trim() : 'Aktuální dostupnost najdeš v e-shopu.');\n    const cart = nativeCart(form);\n    const structuredStock = form && form.querySelector('[itemprop=\"availability\"]');\n    const outOfStock = structuredStock && /OutOfStock|Discontinued|SoldOut/.test(structuredStock.href || structuredStock.getAttribute('content') || '');\n    const soldOutText = sourceStock && /vyprodán|není skladem|nedostupn/i.test(sourceStock.textContent);\n    const canBuy = !!cart && !outOfStock && !soldOutText;\n    action.disabled = !form;\n    const exactBinding = !!root.dataset.glProductId;\n    action.dataset.mode = canBuy ? (exactBinding ? 'buy' : 'purchase-location') : (form ? 'availability' : 'standalone');\n    write(action, canBuy ? (exactBinding ? 'Do košíku' : 'Přejít k nákupu') : (form ? 'Zpět k dostupnosti' : 'Nákup v e-shopu'));\n    availability.classList.toggle('gl-available', canBuy);\n    write(message, form ? (canBuy ? (exactBinding ? 'Cena i dostupnost odpovídají hlavnímu produktu.' : 'Cena a dostupnost z hlavního detailu. Nákup dokončíš u hlavního tlačítka.') : 'Stav a možnost hlídání najdeš v hlavním detailu produktu.') : 'Samostatný náhled. Košík a cena se připojí na stránce tohoto boxu.');\n    preferGallery(form);\n  }\n  action.addEventListener('click', function () {\n    // Re-evaluate current stock synchronously; never use a stale cached target.\n    sync();\n    const form = host();\n    if (!form || action.disabled) return;\n    if (action.dataset.mode === 'buy') {\n      const cart = nativeCart(form);\n      if (cart) cart.click();\n    } else {\n      const target = (action.dataset.mode === 'purchase-location' ? nativeCart(form) : null) || form.querySelector('.availability-value') || form;\n      target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});\n      if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');\n      target.focus({preventScroll: true});\n    }\n  });\n  // No automatic outgoing requests: details are native <details> elements.\n  // Re-query DOM to tolerate Shoptet replacing the form after a variant update.\n  const observer = new MutationObserver(records => {\n    if (records.every(record => root.contains(record.target))) return;\n    clearTimeout(timer); timer = setTimeout(sync, 100);\n  });\n  function init() {\n    sync();\n    observer.observe(document.body, {childList: true, subtree: true, characterData: true,\n      attributes: true, attributeFilter: ['disabled', 'aria-disabled', 'src', 'srcset', 'class', 'href', 'content', 'value']});\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});\n  else init();\n  window.addEventListener('pagehide', function () { observer.disconnect(); clearTimeout(timer); }, {once: true});\n})();\n<\/script><\/body>\n<\/html>\n"}</script><script>const pages=JSON.parse(document.getElementById('pages').textContent),box=document.getElementById('box'),state=document.getElementById('state'),kind=document.getElementById('kind'),frame=document.getElementById('preview');function show(){frame.srcdoc=pages[box.value+'-'+state.value+'-'+kind.value];document.getElementById('note').textContent=state.value==='before'?'Původní verze je statická vizuální reference, staré síťové skripty se nespouštějí.':'Nové detaily a FAQ fungují. Nákup se připojuje až v hostitelském e-shopu.';}[box,state,kind].forEach(e=>e.addEventListener('change',show));show();</script></body></html>
